server:
  port: 8086

spring:
  application:
    name: reporting-service
  autoconfigure:
    # Xác thực do Gateway đảm nhận; tắt user/password mặc định mà Boot tự sinh
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    # Instant lưu UTC; TIMESTAMP của MySQL quy đổi theo session time zone nên ép session = UTC
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/pet_clinic_reporting_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:vetclinic_dev}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  jpa:
    open-in-view: false        # Giải phóng connection ngay sau khi Service kết thúc
    hibernate:
      ddl-auto: validate       # Schema chỉ thay đổi qua docs/schema_init.sql (lộ trình v4)
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:vetclinic}
    password: ${RABBITMQ_PASSWORD:vetclinic_dev}
    publisher-confirm-type: correlated   # OutboxRelay chờ RabbitMQ xác nhận mới đánh dấu PUBLISHED
    listener:
      simple:
        default-requeue-rejected: false   # Hết retry -> đẩy sang DLQ, không requeue vô hạn
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 15000     # khác 2 giây của các service khác: chỉ job dựng lại (admin chạy tay) đọc trang outbox tối đa 1000 dòng; không có Circuit Breaker

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

vetclinic:
  security:
    public-paths: []           # Báo cáo chỉ cho ADMIN (bước 7.2); bước 7.1 chưa có endpoint
  reporting:
    zone: Asia/Ho_Chi_Minh     # Ngày nghiệp vụ (business_date) tính theo giờ phòng khám, không theo UTC
