# Hệ thống Quản lý Phòng khám Thú y - chạy toàn bộ bằng 1 lệnh:
#   docker compose up -d --build
# Chế độ dev (mở port MySQL/RabbitMQ/Eureka/Mailpit để chạy service trong IDE):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Reset CSDL (bắt buộc sau khi sửa docs/schema_init.sql hoặc docs/seed_demo_data.sql):
#   docker compose down -v
# MySQL nạp lược đồ đích v4.0 docs/schema_init.sql rồi dữ liệu demo docs/seed_demo_data.sql (từ bước 8.2 của lộ trình v4; không còn thư mục db/).
#
# Chỉ api-gateway public port ra ngoài: service con tin header X-User-* do Gateway gắn,
# nên mở port của chúng = cho phép giả mạo quyền.

name: vetclinic

x-healthcheck-timing: &healthcheck-timing
  interval: 10s
  timeout: 5s
  retries: 15
  start_period: 40s

x-spring-env: &spring-env
  # JVM phải ở UTC (xem common-library TimeZones); giờ phòng khám được tính tường minh trong mã
  TZ: UTC
  EUREKA_URL: http://service-registry:8761/eureka
  DB_HOST: mysql-server
  DB_PORT: "3306"
  DB_USERNAME: root
  DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Thiếu MYSQL_ROOT_PASSWORD trong .env}
  RABBITMQ_HOST: rabbitmq-broker
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Thiếu RABBITMQ_USERNAME trong .env}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Thiếu RABBITMQ_PASSWORD trong .env}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}

x-spring-service: &spring-service
  restart: unless-stopped
  mem_limit: 512m
  networks: [vetclinic-net]

x-depends-on-infra: &depends-on-infra
  service-registry:
    condition: service_healthy
  mysql-server:
    condition: service_healthy
  rabbitmq-broker:
    condition: service_healthy

services:
  mysql-server:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Thiếu MYSQL_ROOT_PASSWORD trong .env}
      TZ: Asia/Ho_Chi_Minh
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
      # Script chỉ chạy khi volume còn trống -> sửa schema thì phải `docker compose down -v`
      # Lược đồ đích v4.0 (5 CSDL, 52 bảng)
      - ./docs/schema_init.sql:/docker-entrypoint-initdb.d/01-schema_init.sql:ro
      # Dữ liệu demo cố định cho mọi kiểm thử; chạy sau 01-schema_init.sql
      - ./docs/seed_demo_data.sql:/docker-entrypoint-initdb.d/02-seed_demo_data.sql:ro
    healthcheck:
      # Ping qua TCP (127.0.0.1) và kiểm tra dữ liệu của script cuối cùng (02-seed_demo_data.sql: bảng pets có >= 2 dòng):
      # trong lúc init, MySQL chỉ mở socket, nên `mysqladmin ping` sẽ báo healthy quá sớm khi schema/seed chưa nạp xong.
      test: ["CMD-SHELL", "n=$$(mysql -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD -N -e 'SELECT COUNT(*) FROM pet_clinic_clinical_db.pets' 2>/dev/null); [ \"$${n:-0}\" -ge 2 ]"]
      <<: *healthcheck-timing
    networks: [vetclinic-net]

  rabbitmq-broker:
    image: rabbitmq:3.12-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?Thiếu RABBITMQ_USERNAME trong .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Thiếu RABBITMQ_PASSWORD trong .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      <<: *healthcheck-timing
    networks: [vetclinic-net]

  # Hàng đợi phiếu xếp hàng (Quy chuẩn v4.0 mục 9.3): chỉ clinical-service nối, không publish port ra máy host.
  # AOF everysec: mất tối đa ~1 giây phiếu khi Redis sập; mất hẳn dữ liệu thì QueueRebuildJob dựng lại từ MySQL (bước 6.3).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [vetclinic-net]

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    networks: [vetclinic-net]

  service-registry:
    <<: *spring-service
    build:
      context: ./vetclinic-backend
      args:
        MODULE: service-registry
    image: vetclinic/service-registry:latest
    environment:
      TZ: UTC
      EUREKA_HOSTNAME: service-registry
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      <<: *healthcheck-timing

  api-gateway:
    <<: *spring-service
    build:
      context: ./vetclinic-backend
      args:
        MODULE: api-gateway
    image: vetclinic/api-gateway:latest
    environment:
      <<: *spring-env
      JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET trong .env}
    ports:
      - "8080:8080"
    # Gateway khởi động SAU các service nghiệp vụ để lần lấy danh sách Eureka đầu tiên đã có đủ service:
    # "api-gateway healthy" nghĩa là cả hệ thống sẵn sàng nhận request.
    depends_on:
      service-registry:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      appointment-service:
        condition: service_healthy
      clinical-service:
        condition: service_healthy
      billing-pharmacy-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      reporting-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      <<: *healthcheck-timing

  auth-service:
    <<: *spring-service
    build:
      context: ./vetclinic-backend
      args:
        MODULE: auth-service
    image: vetclinic/auth-service:latest
    environment:
      <<: *spring-env
      JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET trong .env}
    depends_on: *depends-on-infra
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      <<: *healthcheck-timing

  appointment-service:
    <<: *spring-service
    build:
      context: ./vetclinic-backend
      args:
        MODULE: appointment-service
    image: vetclinic/appointment-service:latest
    environment:
      <<: *spring-env
      BOOKING_NO_SHOW_CRON: ${BOOKING_NO_SHOW_CRON:-0 */15 7-21 * * *}
      BOOKING_PENDING_EXPIRY_CRON: ${BOOKING_PENDING_EXPIRY_CRON:-0 5,20,35,50 7-21 * * *}
    depends_on: *depends-on-infra
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      <<: *healthcheck-timing

  clinical-service:
    <<: *spring-service
    build:
      context: ./vetclinic-backend
      args:
        MODULE: clinical-service
    image: vetclinic/clinical-service:latest
    environment:
      <<: *spring-env
      # Thư mục gốc của kho tệp (file_key dạng imaging/yyyy/MM/<uuid>.jpg nằm dưới đây); khóa ký URL tạm: STORAGE_SECRET, mặc định dùng JWT_SECRET
      STORAGE_ROOT: /app/uploads
      STORAGE_SECRET: ${STORAGE_SECRET:-${JWT_SECRET}}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - imaging-data:/app/uploads
    depends_on:
      <<: *depends-on-infra
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      <<: *healthcheck-timing

  billing-pharmacy-service:
    <<: *spring-service
    build:
      context: ./vetclinic-backend
      args:
        MODULE: billing-pharmacy-service
    image: vetclinic/billing-pharmacy-service:latest
    environment:
      <<: *spring-env
    depends_on: *depends-on-infra
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]
      <<: *healthcheck-timing

  notification-service:
    <<: *spring-service
    build:
      context: ./vetclinic-backend
      args:
        MODULE: notification-service
    image: vetclinic/notification-service:latest
    environment:
      <<: *spring-env
      JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET trong .env}   # kiểm tra JWT trong STOMP CONNECT
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    depends_on:
      service-registry:
        condition: service_healthy
      rabbitmq-broker:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health"]
      <<: *healthcheck-timing

  # Mô hình đọc báo cáo (CQRS, bước 7.1): chỉ NHẬN sự kiện RabbitMQ và ghi pet_clinic_reporting_db; API báo cáo + route Gateway ở bước 7.2
  reporting-service:
    <<: *spring-service
    build:
      context: ./vetclinic-backend
      args:
        MODULE: reporting-service
    image: vetclinic/reporting-service:latest
    environment:
      <<: *spring-env
    depends_on: *depends-on-infra
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/actuator/health"]
      <<: *healthcheck-timing

  # Giao diện web (React + nginx). Trình duyệt gọi API qua Gateway ở http://localhost:8080 (CORS_ALLOWED_ORIGINS phải có origin này).
  frontend:
    build:
      context: ./fe
      args:
        REACT_APP_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    image: vetclinic/frontend:latest
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - vetclinic-net

volumes:
  mysql-data:
  rabbitmq-data:
  imaging-data:
  redis-data:

networks:
  vetclinic-net:
